services:
  it:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    container_name: it-service
    ports:
      - "3100:3100"
    volumes:
      # Mount the source code for hot reloading (only in development)
      - ./:/app
      # Prevent node_modules from being overwritten by the mount (only in development)
      - /app/node_modules
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3100
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3100" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev

  it-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-service
    ports:
      - "3100:3100"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3100
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3100" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

